  .eyebrow{color:var(--red); font-size:12px; letter-spacing:3px; font-weight:bold; text-align:center;}
  h1{font-size:clamp(26px,5vw,38px); font-weight:900; text-align:center; margin-top:10px; line-height:1.1;}
  p.sub{color:var(--gray); text-align:center; margin-top:12px; font-size:15px;}

  /* HOST VIEW */
  .qr-card{
    background:var(--white); padding:26px; border-radius:8px; margin:34px auto 0;
    width:fit-content; display:flex; justify-content:center;
  }

  .link-box{

    word-break:break-all;
  }
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:44px;
  }
  .stat{
    background:var(--card); border:1px solid var(--line); padding:22px 10px;
    text-align:center; border-radius:4px;
  }
  .stat .num{font-size:30px; font-weight:900;}
  .stat.correct .num{color:var(--green);}
  .stat.wrong .num{color:var(--red);}
  .stat .lbl{color:var(--gray); font-size:12px; margin-top:6px; letter-spacing:1px; text-transform:uppercase;}
  .rows{margin-top:14px; max-height:340px; overflow-y:auto; border:1px solid var(--line); border-radius:6px;}
  .row-item{
    display:flex; justify-content:space-between; padding:12px 16px; font-size:14px;
    border-bottom:1px solid var(--line); color:var(--gray);
  }
  .row-item:last-child{border-bottom:none;}
  .row-item span.n{color:var(--white); font-weight:700;}
  .db-note{margin-top:30px; text-align:center; font-size:12px; color:#6b6b6b; line-height:1.6;}

  /* QUIZ VIEW */
  .progress-wrap{background:var(--card); height:6px; border-radius:3px; margin-top:26px; overflow:hidden;}
  .progress-bar{height:100%; background:var(--red); width:10%; transition:width .3s;}
  .qnum{color:var(--gray); font-size:13px; margin-top:14px; text-align:center;}
  .question-card{margin-top:22px;}
  .qtext{font-size:22px; font-weight:800; line-height:1.35; text-align:center;}
  .options{margin-top:28px; display:flex; flex-direction:column; gap:12px;}
  .opt{
    background:var(--card); border:1px solid var(--line); color:var(--white);
    padding:16px 18px; font-size:15px; text-align:left; border-radius:6px; cursor:pointer;
    transition:.15s;
  }
  .opt:hover{border-color:#555;}
  .opt.selected{border-color:var(--red); background:#241014;}
  .opt.correct{border-color:var(--green); background:#0f2318;}
  .opt.incorrect{border-color:var(--red); background:#2a0f14;}
  .nextbtn{
    margin-top:30px; width:100%; padding:16px; background:var(--red); color:var(--white);
    border:none; border-radius:6px; font-size:16px; font-weight:800; cursor:pointer;
    letter-spacing:1px; text-transform:uppercase; opacity:.4; pointer-events:none; transition:.2s;
  }
  .nextbtn.active{opacity:1; pointer-events:auto;}
  .nextbtn:hover.active{background:#a90d26;}

  /* RESULT VIEW */
  .result-hero{text-align:center; margin-top:40px;}
  .score-big{font-size:80px; font-weight:900; line-height:1;}
  .score-sub{color:var(--gray); margin-top:10px; font-size:15px;}
  .result-stats{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:34px;}
  .review{margin-top:40px;}
  .review-item{
    display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .badge{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-weight:900; font-size:13px;
  }

  .badge.no{background:var(--red); color:#2a0000;}
  .review-item .rq{color:var(--white);}
  .review-item .ra{color:var(--gray); margin-top:3px;}
  .save-note{margin-top:26px; text-align:center; font-size:13px; color:var(--gray);}
  footer.pagefoot{margin-top:60px; color:#555; font-size:11px; text-align:center;}
  .hidden{display:none;}
</style>

/* ---------------- ROUTING ----------------
   Hash-based routing (#quiz / #results) is used instead of a query
   string: claude.ai's artifact viewer can normalize/strip query
   params on load, but the URL hash never reaches a server and always
   survives a QR scan / direct open.

   NOTE: this page declares the `db` capability so the host can see a
   live-updating doğru/yanlış dashboard from their own Claude account.
   Per Claude's platform rules, writing to that shared data requires
   the participant to be signed in within the host's Claude
   organization — a fully anonymous, no-account visitor cannot write
   to it. The host (this account) will always be able to read the
   results link regardless. */
function computeMode(){
  const hash = window.location.hash.replace("#","");
  const params = new URLSearchParams(window.location.search);
  if(hash === "results" || params.get("results") === "1") return "results";
  if(hash === "quiz" || params.get("quiz") === "1") return "quiz";
  return "host";
}
let mode = computeMode();
const app = document.getElementById("app");
window.addEventListener("hashchange", () => {
  mode = computeMode();
  boot();
});

/* ---------------- BACKEND (Netlify Function + Blobs) ----------------
   Fully public/anonymous: no Claude account or sign-in needed. Data
   lives in this site's own serverless function, reachable at
   /api/responses (see netlify/functions/responses.mjs). */
const API_URL = "/api/responses";
const db = true; // truthy flag kept so the rest of the code reads naturally

async function apiList(){
  try{
    const res = await fetch(API_URL, { cache: "no-store" });
    if(!res.ok) return [];
    return await res.json();
  }catch(e){ return []; }
}
async function apiAdd(record){
  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(record)
    });
    if(!res.ok) return null;
    return await res.json(); // { ok, id }
  }catch(e){ return null; }
}
async function apiUpdate(id, patch){
  try{
    const res = await fetch(API_URL + "?id=" + encodeURIComponent(id), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch)
    });
    return res.ok;
  }catch(e){ return false; }
}

function drawQr(quizUrl){
  const holder = document.getElementById("qrcode");
  if(!holder) return;
  holder.innerHTML = "";
  new QRCode(holder, {
    text: quizUrl,
    width: 220, height: 220,
    colorDark: "#0a0a0a", colorLight: "#ffffff"
  });
}

let liveStatsTimer = null;
function attachLiveStats(){
  const poll = async () => {
    const items = await apiList();
    let totalCorrect = 0, totalWrong = 0;
    const rowsHtml = [];
    items.slice(0,200).forEach((data) => {
      totalCorrect += data.correct || 0;
      totalWrong += data.wrong || 0;
      const displayName = (data.name && String(data.name).trim()) || "İsimsiz Katılımcı";
      const displayDealer = (data.dealer && String(data.dealer).trim()) || "";
      rowsHtml.push(`<div class="row-item"><span class="n">${escapeHtml(displayName)}${displayDealer ? " · " + escapeHtml(displayDealer) : ""}</span><span>${data.correct ?? 0} doğru / ${data.wrong ?? 0} yanlış</span></div>`);
    });
    const countEl = document.getElementById("statCount");
    const corrEl = document.getElementById("statCorrect");
    const wrongEl = document.getElementById("statWrong");
    const rowsEl = document.getElementById("rows");
    if(!countEl) { clearInterval(liveStatsTimer); return; } // view changed, stop polling
    countEl.textContent = items.length;
    corrEl.textContent = totalCorrect;
    wrongEl.textContent = totalWrong;
    rowsEl.innerHTML = rowsHtml.length ? rowsHtml.join("") : `<div class="row-item"><span>Henüz katılımcı yok</span><span></span></div>`;
  };
  poll();
  clearInterval(liveStatsTimer);
  liveStatsTimer = setInterval(poll, 3000);
}

let resultsTimer = null;
function attachResultsList(){
  const poll = async () => {
    const items = await apiList();
    let totalCorrect = 0, totalWrong = 0;
    const rowsHtml = [];
    items.slice(0,500).forEach((data) => {
      totalCorrect += data.correct || 0;
      totalWrong += data.wrong || 0;
      const displayName = (data.name && String(data.name).trim()) || "İsimsiz Katılımcı";
      const displayDealer = (data.dealer && String(data.dealer).trim()) || "—";
      rowsHtml.push(`
        <tr style="border-bottom:1px solid var(--line);">
          <td style="padding:13px 16px; font-weight:700;">${escapeHtml(displayName)}</td>
          <td style="padding:13px 16px; color:var(--gray);">${escapeHtml(displayDealer)}</td>
          <td style="padding:13px 16px; text-align:center; color:var(--green); font-weight:800;">${data.correct ?? 0}</td>
          <td style="padding:13px 16px; text-align:center; color:var(--red); font-weight:800;">${data.wrong ?? 0}</td>
        </tr>
      `);
    });
    const countEl = document.getElementById("rCount");
    const corrEl = document.getElementById("rCorrect");
    const wrongEl = document.getElementById("rWrong");
    const bodyEl = document.getElementById("resultsTableBody");
    const noteEl = document.getElementById("resultsNote");
    if(!countEl) { clearInterval(resultsTimer); return; }
    countEl.textContent = items.length;
    corrEl.textContent = totalCorrect;
    wrongEl.textContent = totalWrong;
    bodyEl.innerHTML = rowsHtml.length ? rowsHtml.join("") : `<tr><td colspan="4" style="padding:18px; text-align:center; color:var(--gray);">Henüz katılımcı yok.</td></tr>`;
    noteEl.textContent = "Bu tablo canlı olarak güncellenir (3 saniyede bir) — sayfayı yenilemene gerek yok.";
  };
  poll();
  clearInterval(resultsTimer);
  resultsTimer = setInterval(poll, 3000);
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

    <div class="question-card" style="margin-top:36px;">
      <input id="nameInput" type="text" placeholder="Ad Soyad"
        style="width:100%; padding:16px 18px; font-size:16px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--white);" />
      <input id="dealerInput" type="text" placeholder="Bayi Adı"
        style="width:100%; padding:16px 18px; font-size:16px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--white); margin-top:12px;" />
      <div id="nameErr" style="color:var(--red); font-size:13px; margin-top:10px; min-height:16px;"></div>
      <button class="nextbtn active" id="startBtn" style="margin-top:14px;">Teste Başla</button>
    </div>
    <footer class="pagefoot">about.underarmour.com ve Under Armour resmi teknoloji sayfalarından hazırlanmıştır.</footer>
  `;
  const input = document.getElementById("nameInput");
  const dealerInput = document.getElementById("dealerInput");
  input.focus();
  const start = () => {
    const val = input.value.trim();
    const dealerVal = dealerInput.value.trim();
    if(val.length < 2){
      document.getElementById("nameErr").textContent = "Lütfen ad ve soyadını gir.";
      return;
    }
    if(dealerVal.length < 2){
      document.getElementById("nameErr").textContent = "Lütfen bayi adını gir.";
      return;
    }
    participantName = val;
    participantDealer = dealerVal;
    renderQuiz();
  };
  document.getElementById("startBtn").addEventListener("click", start);
  input.addEventListener("keydown", (e) => { if(e.key === "Enter") dealerInput.focus(); });
  dealerInput.addEventListener("keydown", (e) => { if(e.key === "Enter") start(); });
}

/* ---------------- QUIZ VIEW ---------------- */
let current = 0;
let selectedIndex = null;
const answers = new Array(QUESTIONS.length).fill(null);

function renderQuiz(){
  const q = QUESTIONS[current];
  const pct = Math.round(((current) / QUESTIONS.length) * 100 + 5);
  app.innerHTML = `
    <div class="eyebrow">UNDER ARMOUR BİLGİ YARIŞMASI</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="qnum">Soru ${current+1} / ${QUESTIONS.length}</div>
    <div class="question-card">
      <div class="qtext">${q.q}</div>
      <div class="options" id="options">
        ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}
      </div>
      <button class="nextbtn" id="nextBtn">${current === QUESTIONS.length-1 ? "Bitir" : "Sonraki Soru"}</button>
    </div>
    <footer class="pagefoot">about.underarmour.com ve Under Armour resmi teknoloji sayfalarından hazırlanmıştır.</footer>
  `;
  selectedIndex = null;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".opt").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedIndex = parseInt(btn.getAttribute("data-i"));
      document.getElementById("nextBtn").classList.add("active");
    });
  });
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    if(selectedIndex === null) return;
    answers[current] = selectedIndex;
    if(current < QUESTIONS.length - 1){
      current++;
      renderQuiz();
    } else {
      finishQuiz();
    }
  });
}

let currentRecordId = null;

function finishQuiz(){
  let correct = 0, wrong = 0;
  QUESTIONS.forEach((q,i)=>{
    if(answers[i] === q.correct) correct++; else wrong++;
  });
  renderResult(correct, wrong);
  apiAdd({
    name: participantName, dealer: participantDealer, correct, wrong, total: QUESTIONS.length,
    comment: "", rating: 0
  }).then(result => {
    const note = document.getElementById("saveNote");
    if(result && result.ok){
      currentRecordId = result.id;
      if(note) note.textContent = "Sonucun canlı panoya kaydedildi.";
    } else {
      if(note) note.textContent = "Sonucun panoya otomatik kaydedilemedi — yine de aşağıdan WhatsApp/kopyala ile gönderebilirsin.";
    }
  });
}

function buildShareText(correct, wrong, comment, rating){
  const stars = rating ? "★".repeat(rating) + "☆".repeat(5-rating) : "—";
  let txt = `Under Armour Bilgi Yarışması Sonucu\n`;
  txt += `Ad Soyad: ${participantName || "—"}\n`;
  txt += `Bayi: ${participantDealer || "—"}\n`;
  txt += `Doğru: ${correct} / Yanlış: ${wrong} (Toplam ${QUESTIONS.length} soru)\n`;
  txt += `Değerlendirme: ${stars}\n`;
  if(comment) txt += `Yorum: ${comment}\n`;
  return txt;
}

function renderResult(correct, wrong){
  const reviewHtml = QUESTIONS.map((q,i)=>{
    const ok = answers[i] === q.correct;
    return `<div class="review-item">
      <div class="badge ${ok ? "ok":"no"}">${ok ? "✓" : "✕"}</div>
      <div>
        <div class="rq">${i+1}. ${q.q}</div>
        <div class="ra">Senin cevabın: ${q.options[answers[i]] ?? "—"}${ok ? "" : " · Doğrusu: " + q.options[q.correct]}</div>
      </div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="eyebrow">SONUCUN</div>
    <div class="result-hero">
      <div style="color:var(--gray); font-size:15px;">${escapeHtml(participantName || "")}${participantDealer ? " · " + escapeHtml(participantDealer) : ""}</div>
      <div class="score-big">${correct}/${QUESTIONS.length}</div>
      <div class="score-sub">doğru cevapladın</div>
    </div>
    <div class="result-stats">
      <div class="stat correct"><div class="num">${correct}</div><div class="lbl">Doğru</div></div>
      <div class="stat wrong"><div class="num">${wrong}</div><div class="lbl">Yanlış</div></div>
    </div>

    <h3 style="margin-top:40px; font-size:15px; color:var(--gray); letter-spacing:1px; text-transform:uppercase;">Yorum ve Değerlendirme</h3>
    <div class="question-card" style="margin-top:14px;">
      <div id="starRow" style="display:flex; gap:8px; justify-content:center; font-size:30px; margin-bottom:16px;">
        ${[1,2,3,4,5].map(n=>`<span class="star" data-n="${n}" style="cursor:pointer; color:#3a3a3a;">★</span>`).join("")}
      </div>
      <textarea id="commentBox" placeholder="Under Armour bilgi yarışması hakkında yorumunu yaz (opsiyonel)..."
        style="width:100%; min-height:100px; padding:14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--white); font-family:inherit; font-size:14px; resize:vertical;"></textarea>
      <button class="nextbtn active" id="sendCommentBtn" style="margin-top:14px;">Yorumu Panoya Gönder</button>
    </div>
    <div class="save-note" id="saveNote">${db ? "Sonucun canlı panoya kaydediliyor…" : "Bu bağlantıda canlı pano bağlantısı kurulamadı."}</div>

    <h3 style="margin-top:34px; font-size:15px; color:var(--gray); letter-spacing:1px; text-transform:uppercase;">Ya da Doğrudan Paylaş</h3>
    <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
      <button class="nextbtn active" id="waBtn" style="flex:1; min-width:160px; background:#25D366; color:#04210f;">WhatsApp ile Gönder</button>
      <button class="nextbtn active" id="copyBtn" style="flex:1; min-width:160px; background:var(--card); border:1px solid var(--line);">Panoya Kopyala</button>
    </div>
    <div id="shareNote" style="text-align:center; font-size:13px; color:var(--green); margin-top:10px; min-height:16px;"></div>

    <div class="review">${reviewHtml}</div>
    <button class="nextbtn active" style="margin-top:20px; background:var(--card); border:1px solid var(--line);" onclick="window.location.hash=''; window.location.reload();">Ana Ekrana Dön</button>
    <footer class="pagefoot">about.underarmour.com ve Under Armour resmi teknoloji sayfalarından hazırlanmıştır.</footer>
  `;

  let selectedRating = 0;
  document.querySelectorAll("#starRow .star").forEach(star=>{
    star.addEventListener("click", ()=>{
      selectedRating = parseInt(star.getAttribute("data-n"));
      document.querySelectorAll("#starRow .star").forEach(s=>{
        s.style.color = parseInt(s.getAttribute("data-n")) <= selectedRating ? "#ffc93c" : "#3a3a3a";
      });
    });
  });

  document.getElementById("sendCommentBtn").addEventListener("click", async ()=>{
    const commentVal = document.getElementById("commentBox").value.trim();
    const note = document.getElementById("saveNote");
    const doSave = async (id) => {
      const ok = await apiUpdate(id, { comment: commentVal, rating: selectedRating });
      note.textContent = ok ? "Yorumun panoya kaydedildi, teşekkürler!" : "Yorum kaydedilemedi, tekrar dene.";
    };
    if(currentRecordId){
      doSave(currentRecordId);
    } else {
      note.textContent = "Kaydediliyor, birkaç saniye içinde tekrar dene...";
      setTimeout(()=>{ if(currentRecordId) doSave(currentRecordId); }, 1200);
    }
  });

  document.getElementById("waBtn").addEventListener("click", ()=>{
    const comment = document.getElementById("commentBox").value.trim();
    const text = buildShareText(correct, wrong, comment, selectedRating);
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  });
  document.getElementById("copyBtn").addEventListener("click", async ()=>{
    const comment = document.getElementById("commentBox").value.trim();
    const text = buildShareText(correct, wrong, comment, selectedRating);
    const note = document.getElementById("shareNote");
    try{
      await navigator.clipboard.writeText(text);
      note.style.color = "var(--green)";
      note.textContent = "Sonucun panoya kopyalandı — istediğin yere yapıştırabilirsin.";
    }catch(e){
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try{ document.execCommand("copy"); note.style.color = "var(--green)"; note.textContent = "Sonucun panoya kopyalandı."; }
      catch(e2){ note.style.color = "var(--red)"; note.textContent = "Kopyalanamadı, metni elle seçip kopyalayabilirsin."; }
      document.body.removeChild(ta);
    }
  });
}

/* ---------------- INIT ---------------- */
let participantName = "";
let participantDealer = "";

function boot(){
  if(mode === "quiz"){
    current = 0;
    answers.fill(null);
    currentRecordId = null;
    renderNameGate();
  } else if(mode === "results"){
    renderResults();
    attachResultsList();
  } else {
    renderHost();
    attachLiveStats();
  }
}
boot();
</script>
</body>
</html>
